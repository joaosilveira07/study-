<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyOS</title>
    <link rel="stylesheet" href="../styles/register.css">
    <script src="../js/register.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div class="fundo">
            <div class="logo">
                <span class="icon-logo">StudyOS</span>
            </div>

            <div class="secao-formulario">
                <h1>Register new account.</h1>
                <form class="formulario" id="formRegister">
                    <div class="form-header">
                        <p>Please, enter with your details.</p>
                    </div>

                    <div class="divider"><span><a href="../pages/index.html">or click here for back</a></span></div>

                    <div class="input">
                        <label for="name">Name:</label>
                        <input type="text" id="name" placeholder="Peter Parker">
                        <div class="hidden" id="errorName"></div>
                    </div>

                    <div class="input">
                        <label for="dateBirth">Date of Birth:</label>
                        <input type="date" id="dateBirth" placeholder="18">
                        <div class="hidden" id="errorDateBirth"></div>
                    </div>
                    
                    <div class="input">
                        <label for="email">Email:</label>
                        <input type="email" id="email" placeholder="name@example.com">
                        <div class="hidden" id="errorEmail"></div>
                    </div>

                    <div class="input">
                        <label for="password">Password:</label>
                        <input type="password" id="password" placeholder="••••••••">
                        <div class="hidden" id="errorPassword"></div>
                    </div>

                    <button type="submit" class="btn-submit">Register</button>

                </form>
            </div>
        </div>
        
    </main>
</body>
</html>
