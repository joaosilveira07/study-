<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyOS</title>
    <link rel="stylesheet" href="../styles/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div class="esquerda">
            <div class="secao-esquerda">
                
                <div class="logo">
                    <span class="icon-logo">StudyOS</span>
                </div>
                
                <div class="message-principal">
                    <h1>Welcome!</h1>
                    <p>
                        Every student needs a place to get
                        <br><span>organized</span>,
                        <br>And this is the right place!
                    </p>
                </div>

            </div>
        </div>
        
        <div class="direita">
            <div class="secao-direita">
                <h2>Sign up!</h2>
                <form class="form">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="Email ID" required>
        
                    <label for="senha">Password:</label>
                    <input type="password" id="senha" placeholder="Password" required>

                    <a href="#">Forget password?</a>
                    
                    <button type="submit">Login</button>
                    
                    <a href="#">Register</a>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
